name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . ruff==0.16.9
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check --isolated --select E4,E7,E9,F src tests
      - run: git diff --check
