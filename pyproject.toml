[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag-research"
version = "0.6.0"
description = "Reproducible KCV and VOOD baseline tooling for the SECURE benchmark"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
secure-rag = "secure_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
